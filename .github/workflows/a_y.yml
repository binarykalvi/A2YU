name: A2Y

on:
  repository_dispatch:
    types: [A_T]

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-oauthlib google-auth-httplib2 requests

      - name: Download Video Stream
        env:
          VIDEO_URL: ${{ github.event.client_payload.video_url }}
          GOFILE_TOKEN: ${{ secrets.GOFILE_API_TOKEN }}
        run: |
          mkdir -p downloads
          
          python3 -c '
          import os, sys, requests, urllib.parse

          url = os.environ.get("VIDEO_URL", "").strip()
          token = os.environ.get("GOFILE_TOKEN", "").strip()

          if not url:
              print("Error: No VIDEO_URL provided in payload.", file=sys.stderr)
              sys.exit(1)

          download_headers = {"Authorization": f"Bearer {token}"} if token else {}

          # Handle Gofile links by querying the API
          if "gofile.io" in url:
              content_id = url.rstrip("/").split("/")[-1]
              api_url = f"https://api.gofile.io/contents/{content_id}"
              print(f"Fetching metadata from Gofile API for content ID: {content_id}")
              
              # Fetch without auth header to avoid error-notPremium on free accounts
              res = requests.get(api_url).json()
              if res.get("status") != "ok":
                  print(f"Gofile API Error: {res}", file=sys.stderr)
                  sys.exit(1)

              children = res.get("data", {}).get("children", {})
              if not children:
                  print("Error: No files found in Gofile response.", file=sys.stderr)
                  sys.exit(1)

              file_data = next(iter(children.values()))
              download_url = file_data["link"]
              file_name = file_data["name"]
          else:
              download_url = url
              file_name = os.path.basename(urllib.parse.urlparse(url).path) or "downloaded_video.mp4"

          out_path = os.path.join("downloads", file_name)
          print(f"Downloading from: {download_url}")
          print(f"Saving to: {out_path}")

          with requests.get(download_url, headers=download_headers, stream=True) as r:
              r.raise_for_status()
              with open(out_path, "wb") as f:
                  for chunk in r.iter_content(chunk_size=8192):
                      f.write(chunk)

          print("Download complete.")
          '

      - name: Upload to YouTube
        env:
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          VIDEO_TITLE: ${{ github.event.client_payload.title }}
          VIDEO_DESCRIPTION: ${{ github.event.client_payload.description }}
          VIDEO_VISIBILITY: ${{ github.event.client_payload.visibility }}
        run: |
          python3 -c '
          import os, glob, json
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from google.oauth2.credentials import Credentials

          # Reconstruct OAuth credentials from secrets
          token_info = json.loads(os.environ["YOUTUBE_TOKEN_JSON"])
          creds = Credentials.from_authorized_user_info(token_info)
          youtube = build("youtube", "v3", credentials=creds)

          video_files = glob.glob("downloads/*")
          if not video_files:
              raise FileNotFoundError("No video file found in downloads directory.")

          video_path = video_files[0]
          title = os.environ.get("VIDEO_TITLE", "Automated Upload")
          description = os.environ.get("VIDEO_DESCRIPTION", "Uploaded via Binary Kalvi Engine")
          visibility = os.environ.get("VIDEO_VISIBILITY", "unlisted")

          body = {
              "snippet": {
                  "title": title,
                  "description": description,
                  "categoryId": "27"
              },
              "status": {
                  "privacyStatus": visibility,
                  "selfDeclaredMadeForKids": False
              }
          }

          media = MediaFileUpload(video_path, chunksize=-1, resumable=True)
          request = youtube.videos().insert(part="snippet,status", body=body, media_body=media)

          response = None
          while response is None:
              status, response = request.next_chunk()
              if status:
                  print(f"Uploaded {int(status.progress() * 100)}%")

          print(f"Upload Successful! Video ID: {response.get(\"id\")}")
          '
