name: A2Y

on:
  repository_dispatch:
    types: [A T]

jobs:
  download-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node.js Dependencies
        run: npm install googleapis

      - name: Install yt-dlp
        run: |
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Download Video from Gofile Link
        run: |
          mkdir -p downloads
          VIDEO_URL="${{ github.event.client_payload.video_url }}"
          echo "Downloading from URL: $VIDEO_URL"
          yt-dlp -o "downloads/%(title)s.%(ext)s" "$VIDEO_URL"

      - name: Execute Node.js Upload Script
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          VIDEO_TITLE: ${{ github.event.client_payload.title }}
          VIDEO_DESCRIPTION: ${{ github.event.client_payload.description }}
          VIDEO_VISIBILITY: ${{ github.event.client_payload.visibility }}
        run: node upload.js
