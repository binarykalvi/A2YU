name: A2Y

on:
  repository_dispatch:
    types: [A_T]

jobs:
  download-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node Dependencies
        run: |
          npm init -y
          npm install googleapis

      - name: Set up Python for Download
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Download Video
        env:
          VIDEO_URL: ${{ github.event.client_payload.video_url }}
          GOFILE_TOKEN: ${{ secrets.GOFILE_API_TOKEN }}
        run: |
          mkdir -p downloads
          
          python3 -c '
          import os, sys, requests, urllib.parse

          url = os.environ.get("VIDEO_URL", "").strip()
          token = os.environ.get("GOFILE_TOKEN", "").strip()

          if not url:
              print("Error: No VIDEO_URL provided in payload.", file=sys.stderr)
              sys.exit(1)

          download_headers = {"Authorization": f"Bearer {token}"} if token else {}

          # Query Gofile API without auth headers to bypass "error-notPremium" on free accounts
          if "gofile.io" in url:
              content_id = url.rstrip("/").split("/")[-1]
              api_url = f"https://api.gofile.io/contents/{content_id}"
              print(f"Fetching metadata from Gofile API for content ID: {content_id}")
              
              res = requests.get(api_url).json()
              if res.get("status") != "ok":
                  print(f"Gofile API Error: {res}", file=sys.stderr)
                  sys.exit(1)

              children = res.get("data", {}).get("children", {})
              if not children:
                  print("Error: No files found in Gofile response.", file=sys.stderr)
                  sys.exit(1)

              file_data = next(iter(children.values()))
              download_url = file_data["link"]
              file_name = file_data["name"]
          else:
              download_url = url
              file_name = os.path.basename(urllib.parse.urlparse(url).path) or "downloaded_video.mp4"

          out_path = os.path.join("downloads", file_name)
          print(f"Downloading from: {download_url}")
          print(f"Saving to: {out_path}")

          with requests.get(download_url, headers=download_headers, stream=True) as r:
              r.raise_for_status()
              with open(out_path, "wb") as f:
                  for chunk in r.iter_content(chunk_size=8192):
                      f.write(chunk)

          print("Download complete.")
          '

      - name: Upload Video to YouTube via Node.js
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          VIDEO_TITLE: ${{ github.event.client_payload.title }}
          VIDEO_DESCRIPTION: ${{ github.event.client_payload.description }}
          VIDEO_VISIBILITY: ${{ github.event.client_payload.visibility }}
        run: |
          node upload.js
